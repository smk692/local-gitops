# n8n Helm Values (community-charts)
# https://github.com/community-charts/helm-charts/tree/main/charts/n8n

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# PVC 설정
pvc:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce

# 환경 변수
config:
  # SQLite 사용 (기본)
  database:
    type: sqlite
