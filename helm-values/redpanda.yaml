# Redpanda Helm Values
statefulset:
  replicas: 1

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 512Mi  # 메모리 축소
    redpanda:
      memory: 256Mi  # 실제 Redpanda 사용 메모리

storage:
  persistentVolume:
    enabled: false

console:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
