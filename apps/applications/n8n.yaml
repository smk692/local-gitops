apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: n8n
    targetRevision: "1.*"
    helm:
      valuesObject:
        # Database: SQLite (기본)
        db:
          type: sqlite
        # Main node 설정
        main:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: true
            size: 1Gi
        # Worker mode: regular (main node가 처리)
        worker:
          mode: regular
        webhook:
          mode: regular
        # Timezone
        timezone: "Asia/Seoul"
  destination:
    server: https://kubernetes.default.svc
    namespace: applications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
